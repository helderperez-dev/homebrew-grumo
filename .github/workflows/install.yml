name: Grumo installation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and test tap formula
        shell: bash
        run: |
          if ! command -v brew >/dev/null; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          tap="$(brew --repository)/Library/Taps/helderperez-dev/homebrew-grumo"
          mkdir -p "$(dirname "$tap")"
          cp -a "$GITHUB_WORKSPACE" "$tap"
          brew install --build-from-source helderperez-dev/grumo/grumo
          brew test helderperez-dev/grumo/grumo
          grumo version
          brew uninstall helderperez-dev/grumo/grumo
